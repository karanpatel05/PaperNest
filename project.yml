# XcodeGen spec for the app targets. Generate with:
#   brew install xcodegen   # https://github.com/yonaskolb/XcodeGen
#   xcodegen generate       # writes PaperNest.xcodeproj (git-ignored)
#
# STATUS: written without Xcode available; not yet generated or built.
# The first session with Xcode must verify it (docs/SESSION_HANDOFF.md).
name: PaperNest
options:
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: PaperNest
    PRODUCT_BUNDLE_IDENTIFIER: $(PAPERNEST_BUNDLE_ID)
    DEVELOPMENT_TEAM: $(PAPERNEST_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
packages:
  PaperNestKit:
    path: .
targets:
  PaperNest-iOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS/Sources
      - path: Apps/iOS/Resources
        buildPhase: resources
      - path: Apps/Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Apps/iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: PaperNestKit
        product: PaperNestUI
  PaperNest-macOS:
    type: application
    platform: macOS
    sources:
      - path: Apps/Mac/Sources
      - path: Apps/Mac/Resources
        buildPhase: resources
      - path: Apps/Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Apps/Mac/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/Mac/PaperNest.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: PaperNestKit
        product: PaperNestUI
schemes:
  PaperNest-iOS:
    build:
      targets:
        PaperNest-iOS: all
    run:
      config: Debug
    archive:
      config: Release
  PaperNest-macOS:
    build:
      targets:
        PaperNest-macOS: all
    run:
      config: Debug
    archive:
      config: Release

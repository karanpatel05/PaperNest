# XcodeGen spec for the app targets. Generate with:
#   brew install xcodegen   # https://github.com/yonaskolb/XcodeGen
#   xcodegen generate       # writes PaperNest.xcodeproj (git-ignored)
#
# Verified with XcodeGen 2.46.0 and Xcode 27.1 (see docs/TEST_MATRIX.md).
name: PaperNest
options:
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: PaperNest
    PRODUCT_BUNDLE_IDENTIFIER: $(PAPERNEST_BUNDLE_ID)
    DEVELOPMENT_TEAM: $(PAPERNEST_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
packages:
  PaperNestKit:
    path: .
targets:
  PaperNest-iOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS/Sources
      - path: Apps/iOS/Resources
        buildPhase: resources
      - path: Apps/Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Apps/Shared/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Apps/iOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # Empty unless Signing.local.xcconfig turns iCloud on; see Base.xcconfig.
        CODE_SIGN_ENTITLEMENTS: $(PAPERNEST_IOS_ENTITLEMENTS)
        # The Simulator gets a device's stack. An iPhone or iPad gives the main
        # thread 1 MB (1008 KB usable, measured on an iPad Pro, iPadOS 27.0.1);
        # the Simulator gives 8 MB unless told otherwise, so a view that needs
        # more stack than a device has passed every Simulator test and then
        # crashed on a real iPad (2026-11-04 and 2026-11-15). The linker only
        # takes a stack size for a main executable, hence no debug dylib here.
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": "$(inherited) -Wl,-stack_size,0xFC000"
        "ENABLE_DEBUG_DYLIB[sdk=iphonesimulator*]": NO
    dependencies:
      - package: PaperNestKit
        product: PaperNestUI
  PaperNest-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/iOS/UITests
      - path: Tests/Support/SyntheticDocuments.swift
    dependencies:
      - target: PaperNest-iOS
      - package: PaperNestKit
        product: PaperNestStore
      - package: PaperNestKit
        product: PaperNestCore
    settings:
      base:
        PRODUCT_NAME: PaperNestUITests
        PRODUCT_BUNDLE_IDENTIFIER: $(PAPERNEST_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PaperNest-iOS
        TARGETED_DEVICE_FAMILY: "1,2"
  PaperNest-SubscriptionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Apps/iOS/SubscriptionTests
      - path: Tests/Fixtures/PaperNest.storekit
        buildPhase: resources
    dependencies:
      - target: PaperNest-iOS
      - package: PaperNestKit
        product: PaperNestUI
    settings:
      base:
        PRODUCT_NAME: PaperNestSubscriptionTests
        PRODUCT_BUNDLE_IDENTIFIER: $(PAPERNEST_BUNDLE_ID).subscriptiontests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PaperNest.app/PaperNest
        BUNDLE_LOADER: $(TEST_HOST)
  PaperNest-CanvasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PaperNestUITests/InkCanvasCoordinatorTests.swift
      - path: Tests/PaperNestUITests/ScannerPageTests.swift
      - path: Tests/PaperNestUITests/ScanQualityMemoTests.swift
      - path: Tests/PaperNestUITests/WatermarkLogoTests.swift
    dependencies:
      - target: PaperNest-iOS
      - package: PaperNestKit
        product: PaperNestUI
    settings:
      base:
        PRODUCT_NAME: PaperNestCanvasTests
        PRODUCT_BUNDLE_IDENTIFIER: $(PAPERNEST_BUNDLE_ID).canvastests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PaperNest.app/PaperNest
        BUNDLE_LOADER: $(TEST_HOST)
  PaperNest-macOS:
    type: application
    platform: macOS
    sources:
      - path: Apps/Mac/Sources
      - path: Apps/Mac/Resources
        buildPhase: resources
      - path: Apps/Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Apps/Shared/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Apps/Mac/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The sandbox-only file, or the iCloud one when Signing.local.xcconfig says so.
        CODE_SIGN_ENTITLEMENTS: $(PAPERNEST_MAC_ENTITLEMENTS)
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: PaperNestKit
        product: PaperNestUI
schemes:
  PaperNest-iOS:
    build:
      targets:
        PaperNest-iOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PaperNest-iOSUITests
    archive:
      config: Release
  PaperNest-macOS:
    build:
      targets:
        PaperNest-macOS: all
    run:
      config: Debug
    archive:
      config: Release

  PaperNest-Subscriptions:
    build:
      targets:
        PaperNest-iOS: all
    run:
      config: Debug
      storeKitConfiguration: Tests/Fixtures/PaperNest.storekit
      commandLineArguments:
        "-PaperNestLibraryPath /tmp/papernest-subscriptions-host": true
        "-PaperNestDebugSkipWelcome YES": true
        # Turns the Free/Pro boundary on against the local test products above.
        "-PaperNestDebugProProducts test.papernest.pro.monthly,test.papernest.pro.yearly": true
    test:
      config: Debug
      debugEnabled: true
      targets:
        - PaperNest-SubscriptionTests

  PaperNest-Canvas:
    build:
      targets:
        PaperNest-iOS: all
    test:
      config: Debug
      commandLineArguments:
        "-PaperNestLibraryPath /tmp/papernest-canvas-host": true
        "-PaperNestDebugSkipWelcome YES": true
      targets:
        - PaperNest-CanvasTests
